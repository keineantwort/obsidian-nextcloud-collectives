name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck and bundle)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Integration tests (npm run test:int) need the Docker test server and run locally (PLAN §15 no. 8).
