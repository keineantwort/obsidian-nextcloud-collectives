name: Release

# Started by hand ("Run workflow" on main). The version is read from manifest.json (no "v" prefix; Obsidian and BRAT
# require this). If neither a tag nor a release of that version exists yet, the run builds, lints and tests, then sets the
# tag on the built commit (by creating the Forgejo release) and attaches main.js, manifest.json and styles.css as single
# files (docs/release.md). The section of the version in CHANGELOG.md becomes the description of the release.
on:
  workflow_dispatch:

# Two runs at once would race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Node comes with the image, so no download per run (no actions/setup-node).
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          # All tags, to check that the version has none yet.
          fetch-depth: 0

      # Releasing a branch would publish a state that is not on main.
      - name: Check that the run is on main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release only from main, this run is on ${GITHUB_REF}. Choose the branch main in \"Run workflow\"." >&2
            exit 1
          fi

      # The npm cache needs the cache server of the runner (docs/ci-runner.md); without it the step only warns.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Read the version from manifest.json
        run: echo "VERSION=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_ENV"

      - name: Check that manifest.json, package.json and versions.json agree, and CHANGELOG.md describes the version
        run: node scripts/check-release.mjs

      # Stops before the build if the version is released already (a tag, or a release on Forgejo or GitHub).
      - name: Check that the version has no tag and no release yet
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          MIRROR_REPO: ${{ vars.MIRROR_GITHUB_REPO }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
        run: |
          EXISTS=0
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} exists already." >&2
            EXISTS=1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token ${FORGEJO_TOKEN}" "${API}/releases/tags/${VERSION}")
          case "$CODE" in
            404) ;;
            200) echo "Forgejo release ${VERSION} exists already." >&2; EXISTS=1 ;;
            *) echo "Unexpected HTTP ${CODE} when looking for the Forgejo release ${VERSION}." >&2; exit 1 ;;
          esac
          if [ -n "$MIRROR_REPO" ]; then
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${MIRROR_TOKEN}" \
              -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${MIRROR_REPO}/releases/tags/${VERSION}")
            case "$CODE" in
              404) ;;
              200) echo "GitHub release ${VERSION} exists already." >&2; EXISTS=1 ;;
              *) echo "Unexpected HTTP ${CODE} when looking for the GitHub release ${VERSION}." >&2; exit 1 ;;
            esac
          fi
          if [ "$EXISTS" -ne 0 ]; then
            echo "Raise the version in manifest.json (docs/release.md), or delete the old tag and release if it was a failed attempt." >&2
            exit 1
          fi

      # Tag, name and description (the section of the version in CHANGELOG.md) for both release APIs; the tag is set on
      # the commit that was checked out and built.
      - name: Prepare the release description
        run: node scripts/release-notes.mjs "${VERSION}" "${GITHUB_SHA}" > release.json

      - name: Build, lint and test
        run: |
          npm run build
          npm run lint
          npm test

      - name: Verify release files
        run: |
          for f in main.js manifest.json styles.css; do
            [ -s "$f" ] || { echo "Missing release file: $f" >&2; exit 1; }
          done

      # Creating the release sets the tag on the built commit (target_commitish in release.json).
      - name: Create Forgejo tag and release and upload the files
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          # On an HTTP error, print status and server answer instead of failing silently.
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @release.json \
            "${API}/releases") || { echo "$RESPONSE" >&2; exit 1; }
          RELEASE_ID=$(printf '%s' "$RESPONSE" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).id')
          for f in main.js manifest.json styles.css; do
            curl -sS --fail-with-body -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${f};filename=${f}" \
              "${API}/releases/${RELEASE_ID}/assets?name=${f}"
          done

      # BRAT and the Obsidian store read the release from GitHub. Skipped until MIRROR_GITHUB_REPO is set.
      - name: Create GitHub release and upload the files
        if: vars.MIRROR_GITHUB_REPO != ''
        env:
          TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          REPO: ${{ vars.MIRROR_GITHUB_REPO }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          # The tag was created on the server by the Forgejo release; the runner has it only after a fetch, so set it locally.
          git tag "${VERSION}" "${GITHUB_SHA}"
          git -c "http.extraheader=Authorization: Basic ${AUTH}" push "https://github.com/${REPO}.git" "refs/tags/${VERSION}"
          # On an HTTP error, print status and server answer instead of failing silently.
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @release.json \
            "https://api.github.com/repos/${REPO}/releases") || { echo "$RESPONSE" >&2; exit 1; }
          RELEASE_ID=$(printf '%s' "$RESPONSE" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).id')
          for f in main.js manifest.json styles.css; do
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${f}"
          done
