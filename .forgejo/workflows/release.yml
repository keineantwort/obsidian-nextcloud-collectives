name: Release

# A tag that equals the version in manifest.json (no "v" prefix; Obsidian and BRAT require this) builds the release
# and attaches main.js, manifest.json and styles.css as single files to a Forgejo release (docs/release.md).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches manifest.json, package.json and versions.json
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"

      - name: Build, lint and test
        run: |
          npm run build
          npm run lint
          npm test

      - name: Verify release files
        run: |
          for f in main.js manifest.json styles.css; do
            [ -s "$f" ] || { echo "Missing release file: $f" >&2; exit 1; }
          done

      - name: Create Forgejo release and upload the files
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\"}" \
            "${API}/releases" | jq -r '.id')
          for f in main.js manifest.json styles.css; do
            curl -sf -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${f};filename=${f}" \
              "${API}/releases/${RELEASE_ID}/assets?name=${f}"
          done

      # BRAT and the Obsidian store read the release from GitHub. Skipped until MIRROR_GITHUB_REPO is set.
      - name: Create GitHub release and upload the files
        if: vars.MIRROR_GITHUB_REPO != ''
        env:
          TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          REPO: ${{ vars.MIRROR_GITHUB_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=Authorization: Basic ${AUTH}" push "https://github.com/${REPO}.git" "refs/tags/${TAG}"
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\"}" \
            "https://api.github.com/repos/${REPO}/releases" | jq -r '.id')
          for f in main.js manifest.json styles.css; do
            curl -sf -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${f}"
          done
