name: Release

# A tag that equals the version in manifest.json (no "v" prefix; Obsidian and BRAT require this) builds the release
# and attaches main.js, manifest.json and styles.css as single files to a Forgejo release (docs/release.md). The section
# of the version in CHANGELOG.md becomes the description of the release. Only a tag on main is released.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    # Node comes with the image, so no download per run (no actions/setup-node).
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          # The history of main, to check that the tag is on it.
          fetch-depth: 0

      # A tag set before its pull request was merged points to a commit of the branch and would release a state that is
      # not on main. A tag on an older commit of main is stopped by the version check below.
      - name: Check that the tag is on main
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            {
              echo "Tag ${GITHUB_REF_NAME} points to $(git rev-parse --short "$GITHUB_SHA"), which is not on main."
              echo "Merge the pull request first, then move the tag to main:"
              echo "  git push origin :refs/tags/${GITHUB_REF_NAME} && git tag -d ${GITHUB_REF_NAME}"
              echo "  git checkout main && git pull --ff-only origin main && git tag ${GITHUB_REF_NAME} && git push origin ${GITHUB_REF_NAME}"
            } >&2
            exit 1
          fi

      # The npm cache needs the cache server of the runner (docs/ci-runner.md); without it the step only warns.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check that the tag matches manifest.json, package.json and versions.json, and CHANGELOG.md describes it
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"

      # Tag, name and description (the section of the version in CHANGELOG.md) for both release APIs.
      - name: Prepare the release description
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release.json

      - name: Build, lint and test
        run: |
          npm run build
          npm run lint
          npm test

      - name: Verify release files
        run: |
          for f in main.js manifest.json styles.css; do
            [ -s "$f" ] || { echo "Missing release file: $f" >&2; exit 1; }
          done

      - name: Create Forgejo release and upload the files
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # On an HTTP error, print status and server answer instead of failing silently.
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @release.json \
            "${API}/releases") || { echo "$RESPONSE" >&2; exit 1; }
          RELEASE_ID=$(printf '%s' "$RESPONSE" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).id')
          for f in main.js manifest.json styles.css; do
            curl -sS --fail-with-body -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${f};filename=${f}" \
              "${API}/releases/${RELEASE_ID}/assets?name=${f}"
          done

      # BRAT and the Obsidian store read the release from GitHub. Skipped until MIRROR_GITHUB_REPO is set.
      - name: Create GitHub release and upload the files
        if: vars.MIRROR_GITHUB_REPO != ''
        env:
          TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          REPO: ${{ vars.MIRROR_GITHUB_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=Authorization: Basic ${AUTH}" push "https://github.com/${REPO}.git" "refs/tags/${TAG}"
          # On an HTTP error, print status and server answer instead of failing silently.
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @release.json \
            "https://api.github.com/repos/${REPO}/releases") || { echo "$RESPONSE" >&2; exit 1; }
          RELEASE_ID=$(printf '%s' "$RESPONSE" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).id')
          for f in main.js manifest.json styles.css; do
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${f}"
          done
