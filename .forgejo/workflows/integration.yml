name: Integration (Nextcloud versions)

# Runs the integration tests (npm run test:int, without the performance test) against the current Nextcloud major version
# (the newest in TESTED_NEXTCLOUD_MAJORS, src/api/versionCheck.ts) and the newest image on every pull request and every
# merge into main. The two versions before the current one and the performance test run in nightly.yml;
# tests/unit/testedVersions.test.ts checks that both workflows together cover the list. Each run starts a fresh Nextcloud
# with the newest Collectives that fits (hooks/10-collectives.sh) and prints both versions into the log. The job "latest"
# tests the newest image as an early warning for the next major version; it may fail without failing the workflow, and it
# skips its steps while the newest image is the current version (scripts/dev-nextcloud/latest-is-current.sh).
# A release tag does not run the tests again: the tagged commit on main has passed them on its pull request and its merge.
# Runs on the runner label docker-host (requirements: docs/ci-runner.md).
on:
  pull_request:
    # Only changes that can affect the tests; a push to main always runs them.
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/dev-nextcloud/**"
      - ".forgejo/workflows/integration.yml"
      - "vitest.*.config.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch replaces the run that is still going (the cleanup step runs on cancel as well).
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Nextcloud ${{ matrix.nc }}
    # Host runner on the Docker LXCs: no job container, it uses what is installed there (Node, curl, jq, git, Docker with Compose).
    runs-on: docker-host
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 45
    env:
      # Own Compose project and port per version: the matrix jobs may run at the same time on one Docker host.
      COMPOSE_PROJECT_NAME: nc-test-${{ matrix.nc }}
    strategy:
      fail-fast: false
      matrix:
        nc: [35]
        include:
          - { nc: 35, port: 8135 }
          - { nc: latest, port: 8199, experimental: true }
    steps:
      - uses: actions/checkout@v4

      # "latest" is often the same image as the current version; then its job would only repeat that one and is skipped.
      - name: Skip latest if it is the current version
        if: matrix.nc == 'latest'
        run: |
          SAME=$(sh scripts/dev-nextcloud/latest-is-current.sh)
          echo "SAME_AS_CURRENT=${SAME}" >> "$GITHUB_ENV"
          if [ "$SAME" = "true" ]; then echo "nextcloud:apache is the current version, nothing to test." | tee "$GITHUB_STEP_SUMMARY"; fi

      - name: Install dependencies
        if: env.SAME_AS_CURRENT != 'true'
        run: npm ci

      - name: Configure the test server
        if: env.SAME_AS_CURRENT != 'true'
        working-directory: scripts/dev-nextcloud
        run: |
          cp .env.example .env
          sed -i -e "s/^NC_VERSION=.*/NC_VERSION=${{ matrix.nc }}/" -e "s/^NC_PORT=.*/NC_PORT=${{ matrix.port }}/" .env
          # The image of the newest version is nextcloud:apache; "latest-apache" does not exist on Docker Hub.
          if [ "${{ matrix.nc }}" = "latest" ]; then echo "NC_IMAGE_TAG=apache" >> .env; fi

      # A run that hit the timeout or was cancelled can leave the server of its version behind (the cleanup step does not
      # always run then). "up" would reuse it with all pages of that run, which makes every later test slow (see
      # tests/integration/performance.test.ts), so each run first deletes what is left.
      - name: Start Nextcloud with Collectives
        if: env.SAME_AS_CURRENT != 'true'
        working-directory: scripts/dev-nextcloud
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d --wait --wait-timeout 600

      - name: Versions under test
        if: env.SAME_AS_CURRENT != 'true'
        run: |
          sh scripts/dev-nextcloud/versions.sh | tee "$GITHUB_STEP_SUMMARY"

      # Without a TTY the default reporter prints only whole files; verbose shows every test, so a hang is visible.
      - name: Integration tests
        if: env.SAME_AS_CURRENT != 'true'
        run: npm run test:int -- --reporter=verbose

      - name: Server log on failure
        if: failure() && env.SAME_AS_CURRENT != 'true'
        working-directory: scripts/dev-nextcloud
        run: docker compose logs --tail 200 nextcloud

      - name: Stop and delete the test server
        if: always() && env.SAME_AS_CURRENT != 'true'
        working-directory: scripts/dev-nextcloud
        run: docker compose down -v
