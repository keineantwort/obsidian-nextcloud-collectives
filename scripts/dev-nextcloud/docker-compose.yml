# Local Nextcloud test server with Collectives. Never point tests at a productive server.
name: nc-collectives-dev

services:
  nextcloud:
    # NC_IMAGE_TAG overrides the tag as a whole: the newest image is "apache" (there is no "latest-apache").
    image: nextcloud:${NC_IMAGE_TAG:-${NC_VERSION:-33}-apache}
    ports:
      - "127.0.0.1:${NC_PORT:-8080}:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1"
      NC_TEST_USER: ${NC_TEST_USER:-alice}
      NC_TEST_PASSWORD: ${NC_TEST_PASSWORD}
    volumes:
      - nextcloud:/var/www/html
      - ./hooks:/docker-entrypoint-hooks.d/post-installation:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  nextcloud:
